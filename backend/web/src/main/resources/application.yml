spring:
  application:
    name: outingCo-api
  datasource:
    url: jdbc:mysql://localhost:3306/outing_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8081
