spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  server-name: test
  jwt:
    secret: test-secret-key-at-least-32-bytes-long-for-hs256
    expiration-minutes: 60
