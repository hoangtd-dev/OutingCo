services:
  mysql:
    image: mysql:8.0
    container_name: outing-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE:
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "-p"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: outing-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: 
      DB_USERNAME: 
      DB_PASSWORD: 
    ports:
      - "8080:8080"

volumes:
  mysql-data:
